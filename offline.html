<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ইন্টারনেট নেই – Bus Skin Store BD</title>
<style>
:root{--bg:#f1f3f6;--text:#14181f;--muted:#5b6574;--g:#0a7d5a}
@media (prefers-color-scheme:dark){:root{--bg:#0e1218;--text:#eef1f6;--muted:#9aa4b4;--g:#18b784}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",sans-serif;text-align:center;padding:24px}
.c{max-width:360px}
.bus{font-size:64px;animation:b 2s ease-in-out infinite}
@keyframes b{50%{transform:translateX(10px)}}
h1{font-size:24px;margin:8px 0}
p{color:var(--muted);line-height:1.6}
button{margin-top:10px;border:0;border-radius:10px;padding:10px 22px;background:var(--g);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.bus{animation:none}}
</style>
</head>
<body>
<div class="c">
  <div class="bus">🚌</div>
  <h1>ইন্টারনেট নেই</h1>
  <p>মোবাইল ডেটা বা ওয়াই-ফাই চালু করে আবার চেষ্টা করুন। সংযোগ ফিরলে সাইট নিজে থেকেই খুলবে।</p>
  <button onclick="location.reload()">আবার চেষ্টা করুন</button>
</div>
<script>addEventListener("online",function(){location.reload()})</script>
</body>
</html>
