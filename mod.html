:root[data-theme="dark"]{--bg:#0e1218;--card:#171c25;--text:#eef1f6;--muted:#9aa4b4;--line:#262d3a;--g:#18b784;--gtext:#04120d;--chip:#212835;--sh:rgba(255,255,255,.12)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hind Siliguri",system-ui,"Segoe UI",sans-serif;line-height:1.55}

.btn{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--text);display:inline-block}
.btn.p{background:var(--g);color:var(--gtext);border-color:var(--g)}

.btn.p:hover::after{transform:translateX(120%);transition:transform .6s}

.facebook{background:#1877f2}.youtube{background:#e60000}.telegram{background:#229ed9}

.big iframe{width:100%;height:100%;border:0}
.thumbs button{position:relative}

.soc{position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}

.cform{display:grid;gap:8px;margin-top:6px}

.cform .btn{justify-self:start}
.cm{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);animation:fi .35s both}
.cm img,.ph2{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--chip)}

.cdel{border:0;background:none;cursor:pointer;opacity:.6}.cdel:hover{opacity:1}

 '<div class="adslot" data-ad="side"></div><div class="box"><h3>শেয়ার করুন</h3><div class="share"><a class="btn" id="shfb" target="_blank" rel="noopener noreferrer" href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href)+'">Facebook</a><a class="btn" id="shtg" target="_blank" rel="noopener noreferrer" href="https://t.me/share/url?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(m.title)+'">Telegram</a><button class="btn" id="cp">লিংক কপি</button></div></div></aside>'+
 '<div class="rest">'+

/* ডাউনলোড বক্স: ব্যাজ নেই হলে ২ বার ১৫ সেকেন্ড, আসল তালা সার্ভারে */
var TK="",WURL="";
async function wurl(){
 if(WURL)return WURL;
 var r=await db.from("site_settings").select("worker_url").eq("id",1).maybeSingle();
 WURL=((r.data&&r.data.worker_url)||"").replace(/\/+$/,"");
 return WURL;
}
async function getTicket(){
 var w=await wurl();if(!w)throw new Error("ডাউনলোড সার্ভার এখনো চালু হয়নি");
 var s=(await db.auth.getSession()).data.session,h=s?{Authorization:"Bearer "+s.access_token}:{};
 var r=await fetch(w+"/ticket?mod="+M.id,{headers:h}),j=await r.json();
 if(!r.ok)throw new Error(j.error||"সমস্যা হয়েছে");
 TK=j.t;return j;
}
async function dlBox(){
 var b=$("dl");
 if(!M.dl_kind&&!safe(M.alt_link)){b.innerHTML='<h3>ডাউনলোড</h3><p class="muted">ডাউনলোড লিংক শীঘ্রই যোগ হবে।</p>';return}
 if(FREE.indexOf(role)>-1){
  try{if(M.dl_kind)await getTicket()}catch(e){b.innerHTML='<h3>ডাউনলোড</h3><p class="muted">'+esc(e.message)+'</p>';return}
  b.innerHTML='<h3>ডাউনলোড</h3><p class="muted">আপনার ব্যাজের জন্য বিজ্ঞাপন ছাড়াই ডাউনলোড ✨</p><button class="btn p dlb" id="go">ডাউনলোড করুন</button>';$("go").onclick=go;return;
 }
 stage(1);
}
function stage(n){
 $("dl").innerHTML='<h3>ডাউনলোড (ধাপ '+n+'/'+ROUNDS+')</h3><div class="adslot" data-ad="'+(n==1?"gate1":"gateVideo")+'"></div><div class="prog"><i id="pb"></i></div><p class="muted" id="ct"></p><button class="btn p dlb" id="nx" disabled>অপেক্ষা করুন...</button><p class="muted" style="margin:8px 0 0">ব্যাজ থাকলে বিজ্ঞাপন ছাড়াই ডাউনলোড করা যায়।</p>';
 ADS.fill($("dl"));
 var left=SECS,bad=false;
 if(n==1&&M.dl_kind){TK="";getTicket().catch(function(e){bad=true;$("ct").textContent=e.message})}
 function up(){if(!bad)$("ct").textContent="অপেক্ষা করুন: "+left+" সেকেন্ড";$("pb").style.width=((SECS-left)/SECS*100)+"%"}
 up();
 var t=setInterval(function(){
  if(document.hidden)return;
  left--;up();
  if(left<=0){
   clearInterval(t);if(!bad)$("ct").textContent="প্রস্তুত ✅";$("pb").style.width="100%";
   var x=$("nx");x.disabled=false;x.textContent=(n<ROUNDS||needVisit())?"পরের ধাপে যান":"ডাউনলোড করুন";
   x.onclick=n<ROUNDS?function(){stage(n+1)}:(needVisit()?function(){visitStage(1)}:go);
  }
 },1000);
}
var VP="";
function needVisit(){return !!(M.dl_kind&&(M.visit_times|0)>0&&safe(M.visit_url))}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}}
async function vcall(path,q){var w=await wurl(),r=await fetch(w+path+"?"+q),j=await r.json();if(!r.ok)throw new Error(j.error||"সমস্যা হয়েছে");return j}
function vstart(vp){return vcall("/vstart","mod="+M.id+"&t="+encodeURIComponent(TK)+"&vp="+encodeURIComponent(vp||""))}
function vdone(st){return vcall("/vdone","mod="+M.id+"&st="+encodeURIComponent(st))}
function visitStage(k){
 var N=M.visit_times|0,secs=M.visit_secs||10;
 $("dl").innerHTML='<h3>ডাউনলোড (ওয়েবসাইট ভিজিট '+k+'/'+N+')</h3><div class="visitcard"><b>🌐 '+esc(hostOf(M.visit_url))+'</b><p>ওয়েবসাইটটি খুলে <b>'+secs+' সেকেন্ড</b> ঘুরে দেখুন, তারপর এখানে ফিরে এসে "নিশ্চিত করুন" চাপুন।</p><button class="btn p dlb" id="vo">ওয়েবসাইট খুলুন ↗</button><div class="prog" style="margin-top:10px"><i id="vb"></i></div><p class="muted" id="vc"></p><button class="btn dlb" id="vd2" disabled>নিশ্চিত করুন</button><p class="muted" style="margin:8px 0 0">⚠️ এটা বাইরের ওয়েবসাইট, নিজ দায়িত্বে খুলুন।</p></div>';
 var st="",t0=0,timer=null;
 $("vo").onclick=function(){
  window.open(M.visit_url,"_blank","noopener,noreferrer");
  t0=Date.now();this.disabled=true;this.textContent="ওয়েবসাইট খোলা হয়েছে ✔";
  vstart(VP).then(function(j){st=j.st}).catch(function(e){$("vc").textContent=e.message});
  timer=setInterval(function(){
   var el=(Date.now()-t0)/1000,left=Math.max(0,Math.ceil(secs-el));
   $("vb").style.width=Math.min(100,el/secs*100)+"%";
   $("vc").textContent=left>0?"ওয়েবসাইটে থাকুন: আরও "+left+" সেকেন্ড":"সময় পূর্ণ ✅ এবার নিশ্চিত করুন";
   if(left<=0){clearInterval(timer);$("vd2").disabled=false}
  },500);
 };
 $("vd2").onclick=async function(){
  if(!st){note("একটু অপেক্ষা করুন...");return}
  this.disabled=true;
  try{
   var j=await vdone(st);VP=j.vp;
   if(k<N)visitStage(k+1);
   else{$("dl").innerHTML='<h3>ডাউনলোড</h3><p class="muted">সব ধাপ শেষ ✅ এবার ডাউনলোড করুন।</p><button class="btn p dlb" id="go">ডাউনলোড করুন</button>';$("go").onclick=go}
  }catch(e){note(e.message);this.disabled=false}
 };
}
function go(){
 if(M.dl_kind){
  if(!TK){note("ডাউনলোডের টিকিট পাওয়া যায়নি, পেজ রিফ্রেশ করুন");return}
  var u=WURL+"/download?mod="+M.id+"&t="+encodeURIComponent(TK)+(VP?"&vp="+encodeURIComponent(VP):"");
  M.downloads=(M.downloads||0)+1;$("sd").textContent=fmt(M.downloads);
  window.open(u,"_blank","noopener");
  return;
 }
 var l=safe(M.alt_link);if(!l)return;
 db.rpc("increment_downloads",{p_id:M.id}).then(function(){});
 M.downloads=(M.downloads||0)+1;$("sd").textContent=fmt(M.downloads);
 window.open(l,"_blank","noopener");
}
async function related(){
 var r=await db.from("mods").select("id,title,cover_url,downloads").eq("category_id",M.category_id).eq("status","approved").neq("id",M.id).order("downloads",{ascending:false}).limit(6);
 if(r.error||!r.data.length)return;
 $("rel").innerHTML='<h2>আরও মড</h2><div class="grid">'+r.data.map(function(m){return '<a class="rc" href="mod.html?id='+m.id+'"><div class="rt">'+(safe(m.cover_url)?'<img loading="lazy" src="'+esc(m.cover_url)+'" alt="">':'<svg style="width:60%;--b:var(--g);--s:var(--y)"><use href="#bus"/></svg>')+'</div><div class="rb">'+esc(m.title)+'<small>⬇ '+fmt(m.downloads)+'</small></div></a>'}).join("")+'</div>';
}

/* রেটিং ও কমেন্ট */
function starsStr(a){var n=Math.round(a);return "★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n)}
function drawRate(){
 var c=M.rating_count||0,a=c?M.rating_sum/c:0;
 $("avg").textContent=c?a.toFixed(1):"—";$("stars").textContent=starsStr(a);
 $("rcnt").textContent=c?c+" জন রেটিং দিয়েছেন":"এখনো কেউ রেটিং দেননি";
}
function paintStars(n){document.querySelectorAll("#mys button").forEach(function(b){b.classList.toggle("on",+b.dataset.star<=n)})}
async function initRC(){
 drawRate();
 var b=$("myr");
 if(!UID){
  b.innerHTML='<div class="muted" style="margin-top:10px">রেটিং ও কমেন্ট করতে <a href="#" id="rl">গুগল দিয়ে লগইন</a> করুন।</div>';
  $("rl").onclick=function(e){e.preventDefault();db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}})};
 }else{
  if(M.uploader&&M.uploader.id==UID){b.innerHTML='<div class="muted" style="margin-top:10px">নিজের মডে রেটিং দেওয়া যায় না।</div>'}
  else{
   var r=await db.from("mod_ratings").select("stars").eq("mod_id",M.id).eq("user_id",UID).maybeSingle();
   MYR=r.data?r.data.stars:0;
   b.innerHTML='<div class="muted" style="margin-top:10px">আপনার রেটিং:</div><div class="myr" id="mys">'+[1,2,3,4,5].map(function(i){return '<button data-star="'+i+'" aria-label="'+i+' তারা">★</button>'}).join("")+'</div>';
   paintStars(MYR);
  }
  $("cform").innerHTML='<textarea id="ct2" rows="3" maxlength="500" placeholder="আপনার মতামত লিখুন..."></textarea><button class="btn p" id="csend">কমেন্ট করুন</button>';
  $("csend").onclick=sendComment;
 }
 loadComments();
}
async function rate(n){
 var r=await db.from("mod_ratings").upsert({mod_id:M.id,user_id:UID,stars:n});
 if(r.error){note(/own mod/i.test(r.error.message)?"নিজের মডে রেটিং দেওয়া যায় না":"সমস্যা: "+r.error.message);return}
 MYR=n;paintStars(n);
 var m=await db.from("mods").select("rating_sum,rating_count").eq("id",M.id).single();
 if(m.data){M.rating_sum=m.data.rating_sum;M.rating_count=m.data.rating_count;drawRate()}
 note("ধন্যবাদ! রেটিং সেভ হয়েছে ⭐");
}
async function loadComments(){
 var r=await db.from("comments").select("id,body,created_at,user_id,author:profiles!user_id(id,display_name,avatar_url,role)").eq("mod_id",M.id).order("created_at",{ascending:false}).limit(100),l=$("clist");
 if(!l)return;
 if(r.error){l.innerHTML="";return}
 var staff=role=="owner"||role=="moderator";
 l.innerHTML=r.data.length?r.data.map(function(c){
  var a=c.author||{};
  return '<div class="cm">'+(safe(a.avatar_url)?'<img src="'+esc(a.avatar_url)+'" alt="" referrerpolicy="no-referrer">':'<div class="ph2"></div>')+'<div class="cb"><div><b><a href="profile.html?u='+esc(a.id||"")+'" style="color:inherit">'+esc(a.display_name||"অজানা")+'</a></b> '+badge(a.role)+' <span class="muted">'+esc(dt(c.created_at))+'</span>'+((UID==c.user_id||staff)?' <button class="cdel" data-cdel="'+c.id+'" aria-label="মুছুন">🗑</button>':"")+'</div><div class="desc">'+nl(c.body)+'</div></div></div>';
 }).join(""):'<div class="muted" style="margin-top:12px">এখনো কোনো কমেন্ট নেই। প্রথম কমেন্ট আপনি করুন!</div>';
}
async function sendComment(){
 var t=$("ct2").value.trim();if(!t){note("কমেন্ট লিখুন");return}
 var b=$("csend");b.disabled=true;
 var r=await db.from("comments").insert({mod_id:M.id,user_id:UID,body:t});
 b.disabled=false;
 if(r.error){note(/too_fast/i.test(r.error.message)?"একটু ধীরে, কিছুক্ষণ পরে আবার কমেন্ট করুন":"সমস্যা: "+r.error.message);return}
 $("ct2").value="";note("কমেন্ট যোগ হয়েছে");loadComments();
}
document.addEventListener("click",async function(e){
 var st=e.target.closest("[data-star]");if(st){rate(+st.dataset.star);return}
 var d=e.target.closest("[data-cdel]");
 if(d&&confirm("এই কমেন্ট মুছে ফেলবেন?")){var r=await db.from("comments").delete().eq("id",d.dataset.cdel);if(r.error)note("মোছা যায়নি");else loadComments()}
});
document.addEventListener("mouseover",function(e){
 if(!$("mys"))return;
 var st=e.target.closest("[data-star]");
 if(st)paintStars(+st.dataset.star);else paintStars(MYR);
});
function openLB(i){
 if(!gal.length)return;CUR=i;
 var o=document.createElement("div");o.className="lb";o.id="lb";
 o.innerHTML='<button class="lbx" aria-label="বন্ধ করুন">✕</button><button class="lbn" data-d="-1" aria-label="আগে">‹</button><div class="lbc" id="lbc"></div><button class="lbn r" data-d="1" aria-label="পরে">›</button><div class="lbi" id="lbi"></div>';
 document.body.appendChild(o);document.body.style.overflow="hidden";lbShow();
}
function lbShow(){var g=gal[CUR];$("lbc").innerHTML=g.t=="v"?itemHTML(CUR,true):'<img src="'+esc(g.u)+'" alt="">';$("lbi").textContent=(CUR+1)+" / "+gal.length}
function lbMove(d){CUR=(CUR+d+gal.length)%gal.length;lbShow()}
function lbClose(){var o=$("lb");if(o){o.remove();document.body.style.overflow=""}}
document.addEventListener("click",function(e){
 if(e.target.closest(".lbx")||e.target.id=="lb"||e.target.id=="lbc"){lbClose();return}
 var n=e.target.closest(".lbn");if(n){lbMove(+n.dataset.d);return}
 if(e.target.closest("#big")&&gal.length)openLB(CUR);
});
document.addEventListener("keydown",function(e){if(!$("lb"))return;if(e.key=="Escape")lbClose();if(e.key=="ArrowRight")lbMove(1);if(e.key=="ArrowLeft")lbMove(-1)});
var TX=0;
document.addEventListener("touchstart",function(e){TX=e.changedTouches[0].clientX},{passive:true});
document.addEventListener("touchend",function(e){if(!$("lb"))return;var d=e.changedTouches[0].clientX-TX;if(Math.abs(d)>50)lbMove(d<0?1:-1)},{passive:true});
async function init(){
 if(typeof SUPABASE_URL=="undefined"||SUPABASE_URL.indexOf("supabase.co")<0){fail("config.js-এ Supabase URL ও কী বসাতে হবে।");return}
 db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 db.from("site_settings").select("logo_url").eq("id",1).maybeSingle().then(function(r){var u=r.data&&r.data.logo_url;if(/^https?:\/\//i.test(u||"")){var sv=$("logo").querySelector("svg");if(sv)sv.outerHTML='<img class="logoimg" src="'+esc(u)+'" alt="">'}});
 var q=new URLSearchParams(location.search),id=+(q.get("id")||0);
 try{if(id)sessionStorage.setItem("mid",id);else id=+(sessionStorage.getItem("mid")||0)}catch(e){}
 $("login").onclick=function(){db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}})};
 var s=(await db.auth.getSession()).data.session;
 if(s){
  UID=s.user.id;
  var p=await db.from("profiles").select("display_name,avatar_url,role").eq("id",s.user.id).single();
  if(p.data){role=p.data.role;$("login").hidden=true;
   $("me").innerHTML=(p.data.avatar_url?'<img src="'+esc(p.data.avatar_url)+'" alt="" referrerpolicy="no-referrer">':"")+badge(role)+'<a class="btn" href="profile.html">প্রোফাইল</a><button class="btn" id="lo">লগআউট</button>';$("me").hidden=false;
   $("lo").onclick=async function(){await db.auth.signOut();location.reload()}}
 }
 if(!id){fail("মড পাওয়া যায়নি।");return}
 var r=await db.from("mods").select("*,uploader:profiles!uploader_id(id,display_name,avatar_url,role,social_facebook,social_youtube,social_telegram),game:games(name),category:categories(name)").eq("id",id).maybeSingle();
 if(r.error||!r.data){fail("মড পাওয়া যায়নি।");return}
 ADS.start(role);M=r.data;render();
 try{var k="v"+id;if(!sessionStorage.getItem(k)){sessionStorage.setItem(k,1);db.rpc("increment_views",{p_id:id}).then(function(){})}}catch(e){}
}
document.addEventListener("click",function(e){
 var t=e.target.closest(".thumbs button");if(t){show(+t.dataset.i);return}
 var a=e.target.closest(".arr");if(a){$("th").scrollBy({left:a.dataset.d*240,behavior:"smooth"});return}
 if(e.target.id=="cp"){navigator.clipboard&&navigator.clipboard.writeText(SHARE||location.href).then(function(){note("লিংক কপি হয়েছে")},function(){prompt("লিংক কপি করুন:",SHARE||location.href)})}
});
var R=document.documentElement;
try{var s0=localStorage.getItem("t");if(s0)R.dataset.theme=s0}catch(e){}
$("theme").onclick=function(){var cur=R.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),n=cur=="dark"?"light":"dark";R.dataset.theme=n;try{localStorage.setItem("t",n)}catch(e){}};
init();
</script>
