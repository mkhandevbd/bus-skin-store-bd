<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>অ্যাডমিন প্যানেল – Bus Skin Store BD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f6;--card:#fff;--text:#14181f;--muted:#5b6574;--line:#dfe3ea;--g:#0a7d5a;--gtext:#fff;--y:#ffc233;--chip:#e6eaf0;--red:#d92d3f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1218;--card:#171c25;--text:#eef1f6;--muted:#9aa4b4;--line:#262d3a;--g:#18b784;--gtext:#04120d;--chip:#212835}}
:root[data-theme="dark"]{--bg:#0e1218;--card:#171c25;--text:#eef1f6;--muted:#9aa4b4;--line:#262d3a;--g:#18b784;--gtext:#04120d;--chip:#212835}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hind Siliguri",system-ui,"Segoe UI",sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0}
.logo{flex:1;font-weight:700;font-size:18px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.p{background:var(--g);color:var(--gtext);border-color:var(--g)}
.btn.d{color:var(--red);border-color:var(--red)}
.me{display:flex;align-items:center;gap:8px}.me img{width:30px;height:30px;border-radius:50%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:16px 0}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--y)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.box h3{margin:0 0 10px;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:28px}.stat span{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:160px}
.muted{color:var(--muted);font-size:14px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--chip)}
.form{display:grid;gap:10px;max-width:520px}
label{display:grid;gap:4px;font-weight:600;font-size:14px}
input[type=text],input[type=url],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.inl{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.inl>*{flex:1;min-width:140px}
.pill{font-size:12px;font-weight:700;border-radius:6px;padding:0 6px;line-height:18px;color:#fff;background:#6b7280}
.pill.owner{background:#d92d3f}.pill.moderator{background:#2563eb}.pill.premium{background:#b7791f}.pill.vip{background:#7c3aed}
.pill.approved{background:#0a7d5a}.pill.rejected{background:#d92d3f}.pill.pending{background:#b7791f}
.empty{padding:30px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14181f;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;max-width:90%}
.pill{position:relative;overflow:hidden}
.pill.owner,.pill.moderator,.pill.premium,.pill.vip{box-shadow:0 0 8px rgba(124,58,237,.5)}
.pill.owner::after,.pill.moderator::after,.pill.premium::after,.pill.vip::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 2.4s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.pv{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pv img{width:90px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.pv.big img{width:200px;height:120px}
.upov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.upcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:360px;width:100%;text-align:center;animation:pop .3s both}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.upcard h3{margin:4px 0}
.ring{position:relative;width:130px;height:130px;margin:0 auto 12px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .rb{stroke:var(--chip)}
.ring .rf{stroke:var(--g);stroke-linecap:round;transition:stroke-dashoffset .25s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.ring.spin svg{animation:upspin 1.1s linear infinite}
@keyframes upspin{from{transform:rotate(-90deg)}to{transform:rotate(270deg)}}
.ring.ok .rf{stroke:#16a34a}.ring.bad .rf{stroke:var(--red)}.ring.bad b{color:var(--red)}
.ck{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.upbar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:12px}
.upbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--y));transition:width .25s}
@media (prefers-reduced-motion:reduce){.ring.spin svg{animation:none}.upcard{animation:none}}
.stp{max-height:90px;max-width:100%;border-radius:8px;border:1px solid var(--line)}
</style>
<link rel="stylesheet" href="m.css">
</head>
<body>
<header><div class="wrap bar">
  <div class="logo">Bus Skin Store BD · অ্যাডমিন</div>
  <a class="btn" href="index.html">সাইট</a>
  <button class="btn" id="theme" aria-label="থিম বদলান">🌓</button>
  <div class="me" id="me" hidden></div>
</div></header>
<main class="wrap" id="app"><div class="empty">লোড হচ্ছে...</div></main>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="fp.js"></script>
<script>
var $=function(i){return document.getElementById(i)},
esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})},
db,ME,G=[],C=[],
ROLES=["user","vip","premium","moderator","owner"],
TABS=[["ov","ওভারভিউ"],["ap","মড তালিকা"],["add","মড যোগ"],["gm","গেম ও ক্যাটাগরি",1],["us","ইউজার ও ব্যাজ",1],["ad","বিজ্ঞাপন",1],["sv","সার্ভার",1],["st","সাইট সেটিং",1]],
ST={pending:"অপেক্ষমাণ",approved:"অ্যাপ্রুভড",rejected:"বাতিল"};

function note(t){var n=$("toast");n.textContent=t;n.hidden=false;clearTimeout(note.t);note.t=setTimeout(function(){n.hidden=true},4500)}
function err(e){note("সমস্যা: "+(e&&e.message?e.message:e))}
function isOwner(){return ME.role=="owner"}
function pill(r){return r&&r!="user"?'<span class="pill '+esc(r)+'">'+esc(r)+'</span>':""}

var WURL="";
async function wurl(){
 if(WURL)return WURL;
 var r=await db.from("site_settings").select("worker_url").eq("id",1).maybeSingle();
 WURL=((r.data&&r.data.worker_url)||"").replace(/\/+$/,"");
 return WURL;
}
async function wpost(path,file,onp,onsent){
 var w=await wurl();if(!w)throw new Error("সার্ভারের লিংক সেট করা হয়নি");
 var s=(await db.auth.getSession()).data.session;if(!s)throw new Error("আবার লগইন করুন");
 return new Promise(function(res,rej){
  var x=new XMLHttpRequest();
  x.open("POST",w+path);
  x.setRequestHeader("Authorization","Bearer "+s.access_token);
  x.setRequestHeader("Content-Type",file.type||"application/octet-stream");
  x.setRequestHeader("X-File-Name",encodeURIComponent(file.name));
  x.upload.onprogress=function(e){if(onp&&e.lengthComputable)onp(e.loaded/e.total)};
  x.upload.onload=function(){if(onsent)onsent()};
  x.onload=function(){var j={};try{j=JSON.parse(x.responseText)}catch(e){}if(x.status>=200&&x.status<300)res(j);else rej(new Error(j.error||"আপলোড ব্যর্থ হয়েছে"))};
  x.onerror=function(){rej(new Error("নেটওয়ার্ক সমস্যা, আবার চেষ্টা করুন"))};
  x.send(file);
 });
}
function prev(inp,box,max){
 var el=$(inp),b=$(box);if(!el||!b)return;
 el.addEventListener("change",function(){
  b.innerHTML="";
  [].slice.call(el.files).slice(0,max).forEach(function(f){
   if(!/^image\//.test(f.type))return;
   var i=document.createElement("img");i.src=URL.createObjectURL(f);i.alt="";b.appendChild(i);
  });
 });
}
function fileInfo(inp,box){
 var el=$(inp),b=$(box);if(!el||!b)return;
 el.addEventListener("change",function(){
  var f=el.files[0];if(!f){b.textContent="";return}
  var mb=f.size/1048576;
  b.textContent=f.name+" · "+mb.toFixed(1)+" MB"+(mb>20?" (২০ MB-এর বেশি, তাই Google Drive লিংক দিন)":"");
 });
}
function upUI(){
 var o=document.createElement("div");o.className="upov";
 o.innerHTML='<div class="upcard"><div class="ring" id="upr"><svg viewBox="0 0 120 120"><circle class="rb" cx="60" cy="60" r="52"/><circle class="rf" id="upf" cx="60" cy="60" r="52"/></svg><b id="upp">0%</b></div><h3 id="upt">আপলোড হচ্ছে...</h3><p class="muted" id="ups"></p><div class="upbar"><i id="upb"></i></div><button class="btn p" id="upc" hidden style="margin-top:14px">ঠিক আছে</button></div>';
 document.body.appendChild(o);
 var C=2*Math.PI*52,f=$("upf"),r=$("upr");
 f.style.strokeDasharray=C;f.style.strokeDashoffset=C;
 return {
  set:function(p,t){p=Math.max(0,Math.min(1,p));r.classList.remove("spin");f.style.strokeDashoffset=C*(1-p);$("upp").textContent=Math.round(p*100)+"%";$("upb").style.width=(p*100)+"%";if(t)$("ups").textContent=t},
  spin:function(t){r.classList.add("spin");if(t)$("ups").textContent=t},
  done:function(title,t,cb){r.classList.remove("spin");r.classList.add("ok");f.style.strokeDashoffset=0;$("upb").style.width="100%";$("upp").innerHTML='<svg viewBox="0 0 24 24" width="58" height="58"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="ck"/></svg>';$("upt").textContent=title;$("ups").textContent=t||"";var c=$("upc");c.hidden=false;c.onclick=function(){o.remove();if(cb)cb()}},
  fail:function(t,cb){r.classList.remove("spin");r.classList.add("bad");$("upp").textContent="✖";$("upt").textContent="আপলোড হয়নি";$("ups").textContent=t||"";var c=$("upc");c.hidden=false;c.textContent="বন্ধ করুন";c.onclick=function(){o.remove();if(cb)cb()}}
 };
}
async function upImg(file){return (await wpost("/img",file)).url}
async function loadBase(){
 var r=await Promise.all([db.from("games").select("*").order("sort_order").order("id"),db.from("categories").select("*").order("sort_order").order("id")]);
 G=r[0].data||[];C=r[1].data||[];
}
function loginBox(msg){
 $("app").innerHTML='<div class="box" style="max-width:420px;margin:40px auto"><h3>অ্যাডমিন লগইন</h3><p class="muted">'+esc(msg)+'</p><button class="btn p" id="gl">গুগল দিয়ে লগইন</button></div>';
 $("gl").onclick=function(){db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}})};
}
async function init(){
 if(typeof SUPABASE_URL=="undefined"||SUPABASE_URL.indexOf("supabase.co")<0){$("app").innerHTML='<div class="empty">config.js ফাইলে Supabase URL ও কী বসাতে হবে।</div>';return}
 db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 var s=(await db.auth.getSession()).data.session;
 if(!s){loginBox("এই পেজ শুধু মালিক ও মডারেটরদের জন্য।");return}
 var r=await db.from("profiles").select("id,display_name,avatar_url,role").eq("id",s.user.id).single();
 if(r.error||!r.data){$("app").innerHTML='<div class="empty">প্রোফাইল পাওয়া যায়নি। লগআউট করে আবার লগইন করুন।</div>';return}
 ME=r.data;
 $("me").innerHTML=(ME.avatar_url?'<img src="'+esc(ME.avatar_url)+'" alt="" referrerpolicy="no-referrer">':'')+pill(ME.role)+'<button class="btn" id="lo">লগআউট</button>';
 $("me").hidden=false;
 $("lo").onclick=async function(){await db.auth.signOut();location.reload()};
 if(ME.role!="owner"&&ME.role!="moderator"){$("app").innerHTML='<div class="empty">আপনার অ্যাকাউন্টে অ্যাডমিন অনুমতি নেই। আপনার ব্যাজ: '+esc(ME.role)+'</div>';return}
 await loadBase();shell();
}
function shell(){
 var t=TABS.filter(function(x){return !x[2]||isOwner()}).map(function(x){return '<button class="tab" data-p="'+x[0]+'">'+x[1]+'</button>'}).join("");
 $("app").innerHTML='<div class="tabs" id="tabs">'+t+'</div><div id="panel"></div>';
 show("ov");
}
function show(p){
 document.querySelectorAll("#tabs .tab").forEach(function(b){b.setAttribute("aria-selected",b.dataset.p==p)});
 ({ov:pOv,ap:pAp,add:pAdd,gm:pGm,us:pUs,ad:pAd,sv:pSv,st:pSt})[p]();
}

/* ওভারভিউ */
async function pOv(){
 var q=function(s){return db.from("mods").select("id",{count:"exact",head:true}).eq("status",s)};
 var r=await Promise.all([q("approved"),q("pending"),db.from("profiles").select("id",{count:"exact",head:true}),db.from("daily_stats").select("*").order("day",{ascending:false}).limit(7)]);
 var rows=(r[3].data||[]).map(function(d){return '<div class="row"><div class="grow">'+esc(d.day)+'</div><div>ভিউ '+d.views+'</div><div>ডাউনলোড '+d.downloads+'</div><div>নতুন ইউজার '+d.new_users+'</div></div>'}).join("");
 $("panel").innerHTML='<div class="stats"><div class="stat"><b>'+(r[0].count||0)+'</b><span>অ্যাপ্রুভড মড</span></div><div class="stat"><b>'+(r[1].count||0)+'</b><span>অপেক্ষমাণ মড</span></div><div class="stat"><b>'+(r[2].count||0)+'</b><span>মোট ইউজার</span></div></div><div class="box"><h3>দৈনিক অ্যাক্টিভিটি (শেষ ৭ দিন)</h3>'+(rows||'<div class="muted">এখনো কোনো তথ্য নেই। ভিজিটর ও ডাউনলোড ট্র্যাকিং পরের ধাপে চালু হবে।</div>')+'</div>';
}

/* মড তালিকা */
async function pAp(){
 $("panel").innerHTML='<div class="box"><div class="inl" style="margin-bottom:8px"><label>অবস্থা<select id="fs"><option value="pending">অপেক্ষমাণ</option><option value="approved">অ্যাপ্রুভড</option><option value="rejected">বাতিল</option></select></label></div><div id="list"></div></div>';
 $("fs").onchange=listMods;listMods();
}
async function listMods(){
 var st=$("fs").value,l=$("list");l.innerHTML='<div class="muted">লোড হচ্ছে...</div>';
 var r=await db.from("mods").select("id,title,status,alt_link,created_at,category_id,game_id,downloads,views,uploader:profiles!uploader_id(display_name,role)").eq("status",st).order("created_at",{ascending:false}).limit(100);
 if(r.error){err(r.error);return}
 if(!r.data.length){l.innerHTML='<div class="empty">এই অবস্থায় কোনো মড নেই।</div>';return}
 l.innerHTML=r.data.map(function(m){
  var c=C.find(function(x){return x.id==m.category_id}),u=m.uploader||{};
  var b=(m.status=="pending"?'<button class="btn p" data-a="ok" data-id="'+m.id+'">অ্যাপ্রুভ</button><button class="btn" data-a="no" data-id="'+m.id+'">বাতিল</button>':"")+'<a class="btn" href="edit.html?id='+m.id+'">এডিট</a><button class="btn d" data-a="del" data-id="'+m.id+'">মুছুন</button>';
  return '<div class="row"><div class="grow"><b>'+esc(m.title)+'</b><div class="muted">'+esc(c?c.name:"")+' · '+esc(u.display_name||"অজানা")+' '+pill(u.role)+(/^https?:\/\//i.test(m.alt_link||"")?' · <a href="'+esc(m.alt_link)+'" target="_blank" rel="noopener noreferrer">লিংক</a>':"")+' · <a href="mod.html?id='+m.id+'" target="_blank">দেখুন</a> · ⬇ '+(m.downloads||0)+' · 👁 '+(m.views||0)+'</div></div>'+b+'</div>';
 }).join("");
}

/* মড যোগ */
function pAdd(){
 if(!G.length){$("panel").innerHTML='<div class="empty">আগে "গেম ও ক্যাটাগরি" ট্যাব থেকে গেম ও ক্যাটাগরি যোগ করুন।</div>';return}
 $("panel").innerHTML='<div class="box"><h3>নতুন মড যোগ</h3><div class="form">'+
 '<label>গেম<select id="mg">'+G.map(function(g){return '<option value="'+g.id+'">'+esc(g.name)+'</option>'}).join("")+'</select></label>'+
 '<label>ক্যাটাগরি<select id="mc"></select></label>'+
 '<label>নাম<input type="text" id="mt" maxlength="120"></label>'+
 '<label>বিবরণ<textarea id="md" rows="3" maxlength="1500"></textarea></label>'+
 '<label>মেইন ছবি (বড় করে প্রথমে দেখাবে, সর্বোচ্চ ৫ MB)<input type="file" id="mf" accept="image/png,image/jpeg,image/webp"><div class="pv big" id="pvm"></div></label>'+
 '<label>প্রিভিউ ছবি (একসাথে একাধিক বাছুন, সর্বোচ্চ ৮টি)<input type="file" id="mp" accept="image/png,image/jpeg,image/webp" multiple><div class="pv" id="pvp"></div></label>'+
 '<label>YouTube প্রিভিউ ভিডিও লিংক (ঐচ্ছিক)<input type="url" id="mvd" placeholder="https://www.youtube.com/watch?v=..."></label>'+
 '<label>গেম ভার্সন (ঐচ্ছিক, যেমন BUSSID v4.3)<input type="text" id="mv" maxlength="40"></label>'+
 '<label>ডাউনলোড গাইড (ঐচ্ছিক, কীভাবে ইনস্টল করবেন)<textarea id="mi" rows="3" maxlength="1500"></textarea></label>'+
 '<label>মূল নির্মাতার নাম (ঐচ্ছিক)<input type="text" id="mn" maxlength="80"></label>'+
 '<label>লেখকের Facebook লিংক (ঐচ্ছিক)<input type="url" id="sf" placeholder="https://"></label>'+
 '<label>লেখকের YouTube লিংক (ঐচ্ছিক)<input type="url" id="sy" placeholder="https://"></label>'+

 h+='<h3 style="margin-top:8px">ডাউনলোড ধাপ ২</h3><label>এখানে কী দেখাবে<select id="ad_mode"><option value="video"'+(c.gate2_mode=="visit"?"":" selected")+'>ভিডিও বিজ্ঞাপন (কোড পেলে)</option><option value="visit"'+(c.gate2_mode=="visit"?" selected":"")+'>ঐচ্ছিক ওয়েবসাইট ভিজিট (ভিডিও কোড না পাওয়া পর্যন্ত)</option></select></label>'+
 '<label>ভিডিও বিজ্ঞাপনের কোড<textarea class="mono" id="ad_gate2_code" rows="3">'+esc(c.gate2_code||"")+'</textarea></label>'+
 '<label>ওয়েবসাইট ভিজিট: শিরোনাম<input type="text" id="ad_vt" maxlength="80" value="'+esc(c.visit_title||"")+'"></label>'+
 '<label>ওয়েবসাইট ভিজিট: ছোট লেখা<input type="text" id="ad_vx" maxlength="160" value="'+esc(c.visit_text||"")+'"></label>'+
 '<label>ওয়েবসাইট ভিজিট: লিংক (https://...)<input type="url" id="ad_vu" value="'+esc(c.visit_url||"")+'"></label>'+
 '<label>ওয়েবসাইট ভিজিট: বাটনের লেখা<input type="text" id="ad_vb" maxlength="40" value="'+esc(c.visit_btn||"")+'"></label>'+
 '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ad_preview"'+(c.preview===false?"":" checked")+'> কোড ফাঁকা জায়গায় "বিজ্ঞাপনের জায়গা" বক্স দেখান (সাইট আসলে চালু হলে বন্ধ করুন)</label>'+
 '<button class="btn p" id="adsave">সেভ করুন</button></div></div>';
 $("panel").innerHTML=h;
 $("adsave").onclick=async function(){
  var n={preview:$("ad_preview").checked,gate2_mode:$("ad_mode").value,gate2_code:$("ad_gate2_code").value.trim(),visit_title:$("ad_vt").value.trim(),visit_text:$("ad_vx").value.trim(),visit_url:$("ad_vu").value.trim(),visit_btn:$("ad_vb").value.trim()};
  ADF.forEach(function(x){n[x[0]]=$("ad_"+x[0]).value.trim()});
  if(n.visit_url&&!/^https?:\/\//i.test(n.visit_url)){note("ওয়েবসাইটের লিংক https:// দিয়ে শুরু হতে হবে");return}
  this.disabled=true;
  var w=await db.from("ad_settings").upsert({id:1,config:n,updated_at:new Date().toISOString()});
  this.disabled=false;
  if(w.error)err(w.error);else note("সেভ হয়েছে। সাইটে রিফ্রেশ করলে দেখা যাবে।");
 };
}
document.addEventListener("click",async function(e){
 var t=e.target.closest("[data-p]");if(t){show(t.dataset.p);return}
 var b=e.target.closest("[data-a]");if(!b)return;
 var a=b.dataset.a,id=+b.dataset.id,now=new Date().toISOString();
 try{
  if(a=="ok"){var r=await db.from("mods").update({status:"approved",approved_at:now,reviewed_by:ME.id}).eq("id",id);if(r.error)throw r.error;note("অ্যাপ্রুভ হয়েছে");listMods()}
  if(a=="no"){var why=prompt("বাতিলের কারণ (ঐচ্ছিক):");if(why===null)return;var r2=await db.from("mods").update({status:"rejected",reject_reason:why||null,reviewed_by:ME.id}).eq("id",id);if(r2.error)throw r2.error;note("বাতিল হয়েছে");listMods()}
  if(a=="del"){if(!confirm("এই মড মুছে ফেলবেন?"))return;var r3=await db.from("mods").delete().eq("id",id);if(r3.error)throw r3.error;note("মুছে গেছে");listMods()}
  if(a=="addg"){
   var n=$("gn").value.trim();if(!n){note("গেমের নাম দিন");return}
   b.disabled=true;var f=$("gf").files[0],img=f?await upImg(f,"games"):null;
   var r4=await db.from("games").insert({name:n,slug:"g"+Date.now().toString(36),image_url:img,sort_order:G.length+1});
   if(r4.error){b.disabled=false;throw r4.error}
   await loadBase();note("গেম যোগ হয়েছে");pGm();
  }
  if(a=="addc"){
   var box=b.closest("[data-g]"),cn=box.querySelector(".cn").value.trim();if(!cn){note("ক্যাটাগরির নাম দিন");return}
   b.disabled=true;var cf=box.querySelector(".cf").files[0],ci=cf?await upImg(cf,"categories"):null;
   var r5=await db.from("categories").insert({game_id:id,name:cn,slug:"c"+Date.now().toString(36),image_url:ci,sort_order:C.filter(function(c){return c.game_id==id}).length+1});
   if(r5.error){b.disabled=false;throw r5.error}
   await loadBase();note("ক্যাটাগরি যোগ হয়েছে");pGm();
  }
  if(a=="tg"){var g=G.find(function(x){return x.id==id}),r6=await db.from("games").update({active:!g.active}).eq("id",id);if(r6.error)throw r6.error;await loadBase();pGm()}
  if(a=="delg"){if(!confirm("গেম ও তার সব ক্যাটাগরি মুছবেন? গেমে মড থাকলে মোছা যাবে না।"))return;var r7=await db.from("games").delete().eq("id",id);if(r7.error)throw r7.error;await loadBase();pGm()}
  if(a=="delc"){if(!confirm("ক্যাটাগরি মুছবেন? এতে মড থাকলে মোছা যাবে না।"))return;var r8=await db.from("categories").delete().eq("id",id);if(r8.error)throw r8.error;await loadBase();pGm()}
 }catch(x){err(x)}
});
document.addEventListener("change",async function(e){
 var s=e.target.closest("[data-u]");if(!s)return;

 if(r.error){err(r.error);pUs()}else note("ব্যাজ বদলানো হয়েছে");
