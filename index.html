  <div class="sl" id="slg"><button class="sla" data-d="-1" aria-label="আগে">‹</button><div class="games scrollx" id="games" role="group" aria-label="গেম বাছাই"></div><button class="sla" data-d="1" aria-label="পরে">›</button></div>
  <div class="sl" id="slt"><button class="sla" data-d="-1" aria-label="আগে">‹</button><div class="tabs scrollx" id="tabs" role="tablist"></div><button class="sla" data-d="1" aria-label="পরে">›</button></div>
  <div class="fbar" id="fbar" hidden>
    <label>সাজান <select id="fs"><option value="dl">বেশি ডাউনলোড</option><option value="new">নতুন</option><option value="rate">সর্বোচ্চ রেটিং</option><option value="comm">বেশি কমেন্ট</option><option value="view">বেশি ভিউ</option></select></label>
    <label>রেটিং <select id="fr"><option value="0">সব</option><option value="3">৩★ বা বেশি</option><option value="4">৪★ বা বেশি</option></select></label>
    <label class="ck"><input type="checkbox" id="fv"> ভিডিও সহ</label>
  </div>
  <div id="o1"></div>
  <div class="adslot" data-ad="mid"></div>
  <div id="o2"></div>
  <div class="adslot" data-ad="bottom"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="ads.js"></script>
<script src="config.js"></script>
<script>
var $=function(i){return document.getElementById(i)},
esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})},
S={games:[],cats:[],mods:[],g:null,t:"all",q:"",sort:"dl",minr:0,vid:false},
BADGE={owner:"Owner",moderator:"Moderator",premium:"Premium",vip:"VIP"},db;

function skel(){
 var c='<div class="card"><div class="th sk"></div><div class="body"><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div></div>';
 $("o1").innerHTML="";$("o2").innerHTML='<section><div class="sk l1" style="height:24px;width:200px;margin-bottom:12px"></div><div class="grid">'+c+c+c+c+'</div></section>';
}
function fail(m){$("o2").innerHTML='<div class="empty">'+esc(m)+'</div>'}
function img(u,n){return u?'<img src="'+esc(u)+'" alt="'+esc(n)+'">':''}
function minisoc(u){return [["f","social_facebook","f","Facebook"],["y","social_youtube","▶","YouTube"],["t","social_telegram","✈","Telegram"]].map(function(x){var l=u[x[1]];return /^https?:\/\//i.test(l||"")?'<a class="sm '+x[0]+'" href="'+esc(l)+'" target="_blank" rel="noopener noreferrer" aria-label="'+x[3]+'" title="'+x[3]+'">'+x[2]+'</a>':""}).join("")}
function isNew(m){return m.created_at&&Date.now()-new Date(m.created_at).getTime()<6048e5}
function fmt(n){n=n||0;return n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":String(n)}
function byNew(a,b){return new Date(b.created_at)-new Date(a.created_at)}
function card(m){
 var u=m.uploader||{},b=BADGE[u.role]?'<span class="badge '+esc(u.role)+'">'+BADGE[u.role]+'</span>':'',
 c=S.cats.find(function(x){return x.id==m.category_id}),
 th=m.cover_url?'<img loading="lazy" decoding="async" src="'+esc(m.cover_url)+'" alt="'+esc(m.title)+'">':'<svg><use href="#bus"/></svg>';
 return '<article class="card"><a class="th" href="mod.html?id='+m.id+'">'+(isNew(m)?'<span class="tag">নতুন</span>':'')+th+'</a><div class="body"><div class="cat">'+esc(c?c.name:"")+'</div><a class="t" href="mod.html?id='+m.id+'">'+esc(m.title)+'</a><div class="meta"><a class="un" href="profile.html?u='+esc(u.id||"")+'">'+(/^https?:\/\//i.test(u.avatar_url||"")?'<img class="av" src="'+esc(u.avatar_url)+'" alt="" referrerpolicy="no-referrer">':"")+esc(u.display_name||"অজানা")+'</a> '+b+minisoc(u)+'</div><div class="dl"><span class="rt">★ '+(m.rating_count?avg(m).toFixed(1):"—")+'</span><span>⬇ '+fmt(m.downloads)+'</span><span>💬 '+fmt(m.comment_count)+'</span><span>👁 '+fmt(m.views)+'</span></div><div class="acts"><a class="btn p" href="mod.html?id='+m.id+'">ডাউনলোড</a></div></div></article>';
}
function row(title,L,mid){var hs=S.t=="all"||S.t=="top";return '<section><h2><span>'+title+'</span>'+(mid&&hs?'<button class="more" data-t="'+mid+'">সব দেখুন ›</button>':'')+'</h2><div class="grid'+(hs?' hs':'')+'">'+L.map(card).join("")+'</div></section>'}
function avg(m){return m.rating_count?m.rating_sum/m.rating_count:0}
function srt(a,b){
 var k=S.sort;
 if(k=="new")return byNew(a,b);
 if(k=="rate")return (avg(b)-avg(a))||((b.rating_count||0)-(a.rating_count||0));
 if(k=="comm")return (b.comment_count||0)-(a.comment_count||0);
 if(k=="view")return (b.views||0)-(a.views||0);
 return (b.downloads||0)-(a.downloads||0);
}
function flt(m){return m.title.toLowerCase().indexOf(S.q.toLowerCase())>-1&&avg(m)>=S.minr&&(!S.vid||!!m.video_url)}
function topRows(){
 var A=S.mods.filter(function(m){return m.title.toLowerCase().indexOf(S.q.toLowerCase())>-1});
 var r=A.filter(function(m){return m.rating_count>0}).sort(function(a,b){return (avg(b)-avg(a))||(b.rating_count-a.rating_count)}).slice(0,6),
 c=A.filter(function(m){return m.comment_count>0}).sort(function(a,b){return b.comment_count-a.comment_count}).slice(0,6),
 v=A.slice().sort(function(a,b){return (b.views||0)-(a.views||0)}).slice(0,6);
 return (r.length?row("⭐ সর্বোচ্চ রেটিং",r):"")+(c.length?row("💬 সবচেয়ে বেশি কমেন্ট",c):"")+(v.length?row("👁 সবচেয়ে বেশি ভিউ",v):"");
}
function sec(c){
 var L=S.mods.filter(function(m){return m.category_id==c.id&&flt(m)}).sort(srt);
 if(!L.length)return"";
 if(S.t=="all")L=L.slice(0,6);
 return row((S.t=="all"?"জনপ্রিয় ":"")+esc(c.name),L,c.id);
}
function draw(){
 $("games").innerHTML=S.games.map(function(g){return '<button class="chip" aria-pressed="'+(g.id==S.g)+'" data-g="'+g.id+'">'+img(g.image_url,g.name)+esc(g.name)+'</button>'}).join("");
 $("tabs").innerHTML='<button class="tab" role="tab" aria-selected="'+(S.t=="all")+'" data-t="all">সব</button><button class="tab" role="tab" aria-selected="'+(S.t=="top")+'" data-t="top">🔥 টপ</button>'+S.cats.map(function(c){return '<button class="tab" role="tab" aria-selected="'+(S.t==c.id)+'" data-t="'+c.id+'">'+img(c.image_url,c.name)+esc(c.name)+'</button>'}).join("");
 drawStrip();
 var fb=$("fbar");if(fb)fb.hidden=!S.mods.length||S.t=="top";
 var ms=document.querySelector('.adslot[data-ad="mid"]');if(ms)ms.hidden=!S.mods.length;
 var h="";
 if(S.t=="top")h=topRows();
 else if(S.t=="all"&&!S.q&&!S.minr&&!S.vid&&S.sort=="dl"){var nw=S.mods.slice().sort(byNew).slice(0,6);if(nw.length)h+=row("নতুন যোগ হয়েছে",nw)}
 $("o1").innerHTML=h;h="";
 if(S.t!="top")S.cats.forEach(function(c){if(S.t=="all"||S.t==c.id)h+=sec(c)});
 $("o2").innerHTML=h||((S.t=="top"&&$("o1").innerHTML)?"":'<div class="empty">'+((S.q||S.minr||S.vid)?"কিছু পাওয়া যায়নি। অন্য শব্দে খুঁজুন।":"এখনো কোনো মড যোগ হয়নি, শীঘ্রই আসছে।")+'</div>');
}
async function showMe(sess){
 var l=$("login"),m=$("me");
 if(!sess){ADS.start("guest");l.hidden=false;m.hidden=true;return}
 var r=await db.from("profiles").select("display_name,avatar_url,role").eq("id",sess.user.id).single();
 var p=r.data||{display_name:"ইউজার",role:"user"};
 ADS.start(p.role);
 var b=BADGE[p.role]?'<span class="badge '+esc(p.role)+'">'+BADGE[p.role]+'</span>':'';
 m.innerHTML=(p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="" referrerpolicy="no-referrer">':'')+'<span class="n">'+esc(p.display_name)+'</span>'+b+'<a class="btn" href="profile.html">প্রোফাইল</a><button class="btn" id="logout">লগআউট</button>';
 l.hidden=true;m.hidden=false;
 $("logout").onclick=function(){db.auth.signOut()};
}
function initAuth(){
 $("login").onclick=function(){db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin}})};
 db.auth.onAuthStateChange(function(ev,sess){setTimeout(function(){showMe(sess)},0)});
}
function slider(box){
 var w=box.parentNode;
 function chk(){w.classList.toggle("l",box.scrollLeft>4);w.classList.toggle("r",box.scrollLeft+box.clientWidth<box.scrollWidth-4)}
 box.addEventListener("scroll",chk,{passive:true});
 window.addEventListener("resize",chk);
 new MutationObserver(function(){setTimeout(chk,30)}).observe(box,{childList:true});
 w.querySelectorAll(".sla").forEach(function(b){b.onclick=function(){box.scrollBy({left:+b.dataset.d*box.clientWidth*.7,behavior:"smooth"})}});
 var down=false,sx=0,sl=0,moved=false;
 box.addEventListener("pointerdown",function(e){if(e.pointerType!="mouse")return;down=true;moved=false;sx=e.clientX;sl=box.scrollLeft});
 window.addEventListener("pointermove",function(e){if(!down)return;var dx=e.clientX-sx;if(Math.abs(dx)>5)moved=true;if(moved)box.scrollLeft=sl-dx});
 window.addEventListener("pointerup",function(){down=false});
 box.addEventListener("click",function(e){if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);
 setTimeout(chk,60);
}
function ytId(u){var m=/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/))([\w-]{11})/.exec(u||"");return m?m[1]:""}
function okUrl(u){return /^https?:\/\//i.test(u||"")}
async function loadSite(){
 var r=await db.from("site_settings").select("logo_url,hero_video,hero_image,apk_url").eq("id",1).maybeSingle(),c=r.data||{};
 if(okUrl(c.logo_url)){var sv=$("logo").querySelector("svg");if(sv)sv.outerHTML='<img class="logoimg" src="'+esc(c.logo_url)+'" alt="">'}
 if(okUrl(c.apk_url)&&!$("apkb")){var sp=document.querySelector(".hero .sub");if(sp){var a2=document.createElement("a");a2.id="apkb";a2.className="btn p apk";a2.target="_blank";a2.rel="noopener noreferrer";a2.href=c.apk_url;a2.textContent="📲 অ্যাপ ডাউনলোড (Android)";sp.insertAdjacentElement("afterend",a2)}}
 var u=(c.hero_video||"").trim(),id=ytId(u),h="";
 if(id)h='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&mute=1&loop=1&playlist='+id+'&controls=0&modestbranding=1&playsinline=1&rel=0" title="" allow="autoplay; encrypted-media" tabindex="-1"></iframe>';
 else if(/^https:\/\/.+\.(mp4|webm)(\?.*)?$/i.test(u))h='<video src="'+esc(u)+'" autoplay muted loop playsinline></video>';
 else if(okUrl(c.hero_image))h='<img src="'+esc(c.hero_image)+'" alt="">';
 if(h&&!(navigator.connection&&navigator.connection.saveData)){var go=function(){$("vid").innerHTML=h};if(window.requestIdleCallback)requestIdleCallback(go,{timeout:2500});else setTimeout(go,1200)}
}
var CK="bs_idx_v1";
function cacheGet(){try{var c=JSON.parse(localStorage.getItem(CK)||"null");return c&&c.games&&c.games.length?c:null}catch(e){return null}}
function cacheSet(){try{localStorage.setItem(CK,JSON.stringify({games:S.games,g:S.g,cats:S.cats,mods:S.mods.slice(0,120),st:S.st}))}catch(e){}}
async function loadStats(){
 var r=await db.rpc("get_stats");
 if(r.error||!r.data)return;
 S.st=r.data;drawStrip();cacheSet();
}
function drawStrip(){
 var A=S.st;if(!A||!A.cats)return;
 var bx=A.cats.slice(0,5).map(function(c){return [c.n,c.name]})
  .concat(S.games.slice(0,4).map(function(g){var f=(A.games||[]).filter(function(x){return x.id==g.id})[0],t=/\(([^)]+)\)/.exec(g.name);return [f?f.n:0,(t?t[1]:g.name)+" মড"]}))
  .concat([[fmt(A.downloads),"ডাউনলোড"]]);
 $("strip").innerHTML=bx.map(function(x){return '<div><b>'+x[0]+'</b><span>'+esc(x[1])+'</span></div>'}).join("");
}
async function loadGame(quiet){
 if(!quiet)skel();
 var r=await Promise.all([
  db.from("categories").select("id,name,image_url").eq("game_id",S.g).order("sort_order"),
  db.from("mods").select("id,title,cover_url,downloads,created_at,views,rating_sum,rating_count,comment_count,video_url,category_id,uploader:profiles!uploader_id(id,display_name,avatar_url,role,social_facebook,social_youtube,social_telegram)").eq("game_id",S.g).eq("status","approved").order("downloads",{ascending:false}).limit(200)
 ]);
 if(r[0].error||r[1].error){if(!quiet)fail("ডেটা লোড করা যায়নি। config.js-এ Supabase URL ও কী ঠিক আছে কিনা দেখুন।");return}
 S.cats=r[0].data;S.mods=r[1].data;if(!quiet)S.t="all";draw();
 if(S.games.length&&S.g==S.games[0].id)cacheSet();
}
async function boot(){
 if(typeof SUPABASE_URL=="undefined"||SUPABASE_URL.indexOf("supabase.co")<0){fail("config.js ফাইলে আপনার Supabase URL ও কী বসাতে হবে।");return}
 db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 initAuth();loadSite();
 var c=cacheGet();
 if(c){S.games=c.games;S.g=c.g;S.cats=c.cats;S.mods=c.mods;S.st=c.st;draw()}else skel();
 var r=await db.from("games").select("id,name,image_url").eq("active",true).order("sort_order");
 if(r.error){if(!c)fail("ডেটা লোড করা যায়নি। config.js-এ Supabase URL ও কী ঠিক আছে কিনা দেখুন।");return}
 S.games=r.data;
 if(!S.games.length){fail("এখনো কোনো গেম যোগ হয়নি।");return}
 if(!c||!S.games.some(function(g){return g.id==S.g}))S.g=S.games[0].id;
 loadStats();await loadGame(!!c);
}
document.addEventListener("click",function(e){
 var a=e.target.closest("[data-g]"),b=e.target.closest("[data-t]");
 if(a&&a.dataset.g!=S.g){S.g=+a.dataset.g;S.q="";$("q").value="";loadGame()}
 if(b){S.t=(b.dataset.t=="all"||b.dataset.t=="top")?b.dataset.t:+b.dataset.t;draw();
  var at=document.querySelector("#tabs .tab[aria-selected=true]");if(at&&at.scrollIntoView)at.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  if(b.classList.contains("more"))window.scrollTo({top:Math.max(0,$("slt").offsetTop-90),behavior:"smooth"})}
 var so=e.target.closest("[data-s]");if(so){S.sort=so.dataset.s;draw()}
});
$("q").addEventListener("input",function(e){S.q=e.target.value;if(S.cats.length)draw()});
$("fs").onchange=function(){S.sort=this.value;draw()};
$("fr").onchange=function(){S.minr=+this.value;draw()};
$("fv").onchange=function(){S.vid=this.checked;draw()};
var R=document.documentElement;
try{var s=localStorage.getItem("t");if(s)R.dataset.theme=s}catch(e){}
$("theme").addEventListener("click",function(){
 var cur=R.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),n=cur=="dark"?"light":"dark";
 R.dataset.theme=n;try{localStorage.setItem("t",n)}catch(e){}
});
slider($("games"));slider($("tabs"));
(function(){var t="BUSSID X BSBD STORE",el=$("neon"),i=0;if(!el)return;if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=t;el.classList.add("done");return}function f(){el.textContent=t.slice(0,i++);if(i<=t.length)setTimeout(f,85);else el.classList.add("done")}f()})();
boot();
</script>
