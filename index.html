<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus Skin Store BD – বাস স্কিন, মড ও ম্যাপ ডাউনলোড</title>
<meta name="description" content="বাস সিমুলেটর ইন্দোনেশিয়া (BUSSID) সহ সিমুলেটর গেমের বাস স্কিন, মড ও ম্যাপ ফ্রি ডাউনলোড করুন।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f6;--card:#fff;--text:#14181f;--muted:#5b6574;--line:#dfe3ea;--g:#0a7d5a;--gtext:#fff;--y:#ffc233;--chip:#e6eaf0;--sh:rgba(255,255,255,.6)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1218;--card:#171c25;--text:#eef1f6;--muted:#9aa4b4;--line:#262d3a;--g:#18b784;--gtext:#04120d;--chip:#212835;--sh:rgba(255,255,255,.12)}}
:root[data-theme="dark"]{--bg:#0e1218;--card:#171c25;--text:#eef1f6;--muted:#9aa4b4;--line:#262d3a;--g:#18b784;--gtext:#04120d;--chip:#212835;--sh:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hind Siliguri",system-ui,"Segoe UI",sans-serif;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;white-space:nowrap}
.logo svg{width:34px;height:18px;--b:var(--g);--s:var(--y)}
.search{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.p{background:var(--g);color:var(--gtext);border-color:var(--g)}
@media(max-width:640px){.logo span{display:none}}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding:30px 0 4px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:20px}}
h1{font-size:clamp(26px,5vw,42px);line-height:1.25;margin:0 0 10px}
.sub{color:var(--muted);margin:0;max-width:46ch}
.road{position:relative;padding-bottom:18px}
.road svg{width:100%;max-width:340px;display:block;margin:0 auto;--b:var(--g);--s:var(--y)}
.road::after{content:"";position:absolute;left:0;right:0;bottom:4px;border-top:4px dashed var(--y)}
.games,.tabs{display:flex;gap:8px;flex-wrap:wrap}
.games{margin:20px 0 12px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--g);color:var(--gtext);border-color:var(--g);font-weight:700}
.chip img,.tab img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.tabs{border-bottom:1px solid var(--line);margin-bottom:6px}
.tab{display:flex;align-items:center;gap:6px;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--y)}
section{margin:24px 0}
h2{font-size:22px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.th{height:120px;display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--g) 30%,var(--card)),var(--card));overflow:hidden}
.th svg{width:70%;height:auto;--b:var(--g);--s:var(--y)}
.th img{width:100%;height:100%;object-fit:cover}
.body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.dl{color:var(--muted);font-size:13px}
.acts{margin-top:auto;padding-top:6px}
.acts .btn{width:100%;padding:6px 8px;font-size:14px}
.badge{position:relative;overflow:hidden;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;line-height:18px;color:#fff}
.owner{background:#d92d3f}.moderator{background:#2563eb}.premium{background:#b7791f}.vip{background:#7c3aed}
.sk,.premium,.vip{position:relative;overflow:hidden}
.sk{background:var(--chip);border-radius:6px}
.sk::after,.premium::after,.vip::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--sh),transparent);animation:sh 1.5s infinite}
.premium::after,.vip::after{animation-duration:2.6s;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent)}
@keyframes sh{to{transform:translateX(100%)}}
.th.sk{border-radius:0;height:120px;width:100%}
.l1{height:16px;width:80%}.l2{height:12px;width:50%}.l3{height:30px;width:100%;margin-top:8px}
.empty{padding:34px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin-top:20px}
footer{border-top:1px solid var(--line);margin-top:36px;padding:20px 0;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.sk::after,.premium::after,.vip::after{animation:none}}
[hidden]{display:none!important}
.me{display:flex;align-items:center;gap:8px}
.me img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.me .n{font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){.me .n{display:none}#theme{padding:7px 10px}}
h1 em{font-style:normal;color:var(--g)}
.strip{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.strip div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 16px;min-width:84px}
.strip b{display:block;font-size:22px;line-height:1.2}.strip span{font-size:13px;color:var(--muted)}
.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap}
.th{position:relative}
.tag{position:absolute;top:8px;left:8px;background:#e8590c;color:#fff;font-size:12px;font-weight:700;padding:0 8px;line-height:20px;border-radius:6px;z-index:1}
.cat{font-size:12px;font-weight:700;color:var(--g)}
.card{transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sort{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
.sort .chip{padding:3px 12px;font-size:14px}
@media(max-width:640px){.bar{flex-wrap:wrap}.search{order:5;flex-basis:100%}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.th{height:100px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.rgb,h1 em{background:linear-gradient(90deg,#ff2d55,#ff9500,#ffd60a,#30d158,#0a84ff,#bf5af2,#ff2d55);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:rgb 6s linear infinite}
@keyframes rgb{to{background-position:300% 0}}
.strip div{border-top:3px solid var(--y)}
.strip .sk{width:96px;height:62px;padding:0;border-top:0}
@media(max-width:640px){.logo span{display:inline}.logo{font-size:18px}}
@media (prefers-reduced-motion:reduce){.rgb,h1 em{animation:none}}
a.t{color:inherit;text-decoration:none;display:block}a.t:hover{color:var(--g)}
a.btn{text-decoration:none;display:block;text-align:center}
.btn.p{position:relative;overflow:hidden}
.btn.p::after{content:"";position:absolute;inset:0;transform:translateX(-120%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
.btn.p:hover::after{transform:translateX(120%);transition:transform .6s}
.card{animation:fi .45s both}@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.strip div{transition:transform .15s}.strip div:hover{transform:translateY(-2px)}
.badge::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 2.4s infinite}
.owner{box-shadow:0 0 8px rgba(217,45,63,.7)}.moderator{box-shadow:0 0 8px rgba(37,99,235,.6)}.premium{box-shadow:0 0 8px rgba(183,121,31,.7)}.vip{box-shadow:0 0 8px rgba(124,58,237,.7)}
.th{text-decoration:none}
@media (prefers-reduced-motion:reduce){.card{animation:none}.badge::after{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="bus" viewBox="0 0 120 56"><rect x="4" y="6" width="112" height="38" rx="7" fill="var(--b)"/><rect x="4" y="30" width="112" height="7" fill="var(--s)"/><g fill="#dff3ff" opacity=".92"><rect x="12" y="12" width="16" height="14" rx="2"/><rect x="32" y="12" width="16" height="14" rx="2"/><rect x="52" y="12" width="16" height="14" rx="2"/><rect x="72" y="12" width="16" height="14" rx="2"/><rect x="94" y="12" width="16" height="20" rx="2"/></g><circle cx="30" cy="46" r="7" fill="#1a1d24"/><circle cx="92" cy="46" r="7" fill="#1a1d24"/><circle cx="30" cy="46" r="3" fill="#9aa4b4"/><circle cx="92" cy="46" r="3" fill="#9aa4b4"/></symbol></svg>

<header><div class="wrap bar">
  <div class="logo"><svg><use href="#bus"/></svg><span class="rgb">Bus Skin Store BD</span></div>
  <input class="search" id="q" type="search" placeholder="মড, স্কিন বা ম্যাপ খুঁজুন" aria-label="সার্চ">
  <a class="btn" href="upload.html" style="width:auto">আপলোড</a>
  <button class="btn" id="theme" aria-label="থিম বদলান">🌓 থিম</button>
  <button class="btn p" id="login">গুগল দিয়ে লগইন</button>
  <div class="me" id="me" hidden></div>
</div></header>

<main class="wrap">
  <div class="hero">
    <div>
      <h1>বাস স্কিন, বাস মড ডাউনলোড করুন <em>খুব সহজে</em></h1>
      <p class="sub">বাস সিমুলেটর ইন্দোনেশিয়া ও অন্য সিমুলেটর গেমের মড সরাসরি ডাউনলোড করুন।</p>
      <div class="strip" id="strip"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    </div>
    <div class="road"><svg viewBox="0 0 120 56" role="img" aria-label="বাসের ছবি"><use href="#bus"/></svg></div>
  </div>
  <div class="games" id="games" role="group" aria-label="গেম বাছাই"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="out"></div>
</main>

<footer><div class="wrap">© Bus Skin Store BD</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
var $=function(i){return document.getElementById(i)},
esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})},
S={games:[],cats:[],mods:[],g:null,t:"all",q:"",sort:"pop"},
BADGE={owner:"Owner",moderator:"Moderator",premium:"Premium",vip:"VIP"},db;

function skel(){
 var c='<div class="card"><div class="th sk"></div><div class="body"><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div></div>';
 $("out").innerHTML='<section><div class="sk l1" style="height:24px;width:200px;margin-bottom:12px"></div><div class="grid">'+c+c+c+c+'</div></section>';
}
function fail(m){$("out").innerHTML='<div class="empty">'+esc(m)+'</div>'}
function img(u,n){return u?'<img src="'+esc(u)+'" alt="'+esc(n)+'">':''}
function isNew(m){return m.created_at&&Date.now()-new Date(m.created_at).getTime()<6048e5}
function fmt(n){n=n||0;return n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":String(n)}
function byNew(a,b){return new Date(b.created_at)-new Date(a.created_at)}
function card(m){
 var u=m.uploader||{},b=BADGE[u.role]?'<span class="badge '+esc(u.role)+'">'+BADGE[u.role]+'</span>':'',
 c=S.cats.find(function(x){return x.id==m.category_id}),
 th=m.cover_url?'<img loading="lazy" src="'+esc(m.cover_url)+'" alt="'+esc(m.title)+'">':'<svg><use href="#bus"/></svg>';
 return '<article class="card"><a class="th" href="mod.html?id='+m.id+'">'+(isNew(m)?'<span class="tag">নতুন</span>':'')+th+'</a><div class="body"><div class="cat">'+esc(c?c.name:"")+'</div><a class="t" href="mod.html?id='+m.id+'">'+esc(m.title)+'</a><div class="meta">'+esc(u.display_name||"অজানা")+' '+b+'</div><div class="dl">⬇ '+fmt(m.downloads)+' ডাউনলোড</div><div class="acts"><a class="btn p" href="mod.html?id='+m.id+'">ডাউনলোড</a></div></div></article>';
}
function row(title,L){return '<section><h2>'+title+'</h2><div class="grid">'+L.map(card).join("")+'</div></section>'}
function sec(c){
 var q=S.q.toLowerCase(),L=S.mods.filter(function(m){return m.category_id==c.id&&m.title.toLowerCase().indexOf(q)>-1});
 if(!L.length)return"";
 if(S.t=="all")L=L.slice(0,6);else if(S.sort=="new")L=L.slice().sort(byNew);
 return row((S.t=="all"?"জনপ্রিয় ":"")+esc(c.name),L);
}
function draw(){
 $("games").innerHTML=S.games.map(function(g){return '<button class="chip" aria-pressed="'+(g.id==S.g)+'" data-g="'+g.id+'">'+img(g.image_url,g.name)+esc(g.name)+'</button>'}).join("");
 $("tabs").innerHTML='<button class="tab" role="tab" aria-selected="'+(S.t=="all")+'" data-t="all">সব</button>'+S.cats.map(function(c){return '<button class="tab" role="tab" aria-selected="'+(S.t==c.id)+'" data-t="'+c.id+'">'+img(c.image_url,c.name)+esc(c.name)+'</button>'}).join("");
 drawStrip();
 var h="";
 if(S.t=="all"&&!S.q){var nw=S.mods.slice().sort(byNew).slice(0,6);if(nw.length)h+=row("নতুন যোগ হয়েছে",nw)}
 else if(S.t!="all"&&S.mods.length)h+='<div class="sort"><button class="chip" aria-pressed="'+(S.sort=="pop")+'" data-s="pop">জনপ্রিয়</button><button class="chip" aria-pressed="'+(S.sort=="new")+'" data-s="new">নতুন</button></div>';
 S.cats.forEach(function(c){if(S.t=="all"||S.t==c.id)h+=sec(c)});
 $("out").innerHTML=h||'<div class="empty">'+(S.q?"কিছু পাওয়া যায়নি। অন্য শব্দে খুঁজুন।":"এখনো কোনো মড যোগ হয়নি, শীঘ্রই আসছে।")+'</div>';
}
async function showMe(sess){
 var l=$("login"),m=$("me");
 if(!sess){l.hidden=false;m.hidden=true;return}
 var r=await db.from("profiles").select("display_name,avatar_url,role").eq("id",sess.user.id).single();
 var p=r.data||{display_name:"ইউজার",role:"user"};
 var b=BADGE[p.role]?'<span class="badge '+esc(p.role)+'">'+BADGE[p.role]+'</span>':'';
 m.innerHTML=(p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="" referrerpolicy="no-referrer">':'')+'<span class="n">'+esc(p.display_name)+'</span>'+b+'<button class="btn" id="logout">লগআউট</button>';
 l.hidden=true;m.hidden=false;
 $("logout").onclick=function(){db.auth.signOut()};
}
function initAuth(){
 $("login").onclick=function(){db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin}})};
 db.auth.onAuthStateChange(function(ev,sess){setTimeout(function(){showMe(sess)},0)});
}
async function loadStats(){
 var r=await Promise.all([db.from("categories").select("id,name,game_id"),db.from("mods").select("game_id,category_id,downloads").eq("status","approved").limit(5000)]);
 if(r[0].error||r[1].error)return;
 S.all={cats:r[0].data,mods:r[1].data};drawStrip();
}
function drawStrip(){
 var A=S.all;if(!A)return;
 var byName={},order=[],nameOf={},byGame={},tot=0;
 A.cats.forEach(function(c){nameOf[c.id]=c.name;if(!(c.name in byName)){byName[c.name]=0;order.push(c.name)}});
 A.mods.forEach(function(m){var n=nameOf[m.category_id];if(n!=null)byName[n]++;byGame[m.game_id]=(byGame[m.game_id]||0)+1;tot+=m.downloads||0});
 var bx=order.slice(0,5).map(function(n){return [byName[n],n]})
  .concat(S.games.slice(0,4).map(function(g){var t=/\(([^)]+)\)/.exec(g.name);return [byGame[g.id]||0,(t?t[1]:g.name)+" মড"]}))
  .concat([[fmt(tot),"ডাউনলোড"]]);
 $("strip").innerHTML=bx.map(function(x){return '<div><b>'+x[0]+'</b><span>'+esc(x[1])+'</span></div>'}).join("");
}
async function loadGame(){
 skel();
 var r=await Promise.all([
  db.from("categories").select("id,name,image_url").eq("game_id",S.g).order("sort_order"),
  db.from("mods").select("id,title,cover_url,downloads,created_at,category_id,uploader:profiles!uploader_id(display_name,role)").eq("game_id",S.g).eq("status","approved").order("downloads",{ascending:false}).limit(200)
 ]);
 if(r[0].error||r[1].error){fail("ডেটা লোড করা যায়নি। config.js-এ Supabase URL ও কী ঠিক আছে কিনা দেখুন।");return}
 S.cats=r[0].data;S.mods=r[1].data;S.t="all";draw();
}
async function boot(){
 if(typeof SUPABASE_URL=="undefined"||SUPABASE_URL.indexOf("supabase.co")<0){fail("config.js ফাইলে আপনার Supabase URL ও কী বসাতে হবে।");return}
 db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 initAuth();
 skel();
 var r=await db.from("games").select("id,name,image_url").eq("active",true).order("sort_order");
 if(r.error){fail("ডেটা লোড করা যায়নি। config.js-এ Supabase URL ও কী ঠিক আছে কিনা দেখুন।");return}
 S.games=r.data;
 if(!S.games.length){fail("এখনো কোনো গেম যোগ হয়নি।");return}
 S.g=S.games[0].id;loadStats();await loadGame();
}
document.addEventListener("click",function(e){
 var a=e.target.closest("[data-g]"),b=e.target.closest("[data-t]");
 if(a&&a.dataset.g!=S.g){S.g=+a.dataset.g;S.q="";$("q").value="";loadGame()}
 if(b){S.t=b.dataset.t=="all"?"all":+b.dataset.t;draw()}
 var so=e.target.closest("[data-s]");if(so){S.sort=so.dataset.s;draw()}
});
$("q").addEventListener("input",function(e){S.q=e.target.value;if(S.cats.length)draw()});
var R=document.documentElement;
try{var s=localStorage.getItem("t");if(s)R.dataset.theme=s}catch(e){}
$("theme").addEventListener("click",function(){
 var cur=R.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),n=cur=="dark"?"light":"dark";
 R.dataset.theme=n;try{localStorage.setItem("t",n)}catch(e){}
});
boot();
</script>
</body>
</html>
